<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>390 미리보기 (임시)</title>
<style>
  html,body{margin:0;background:#e9edf3}
  body{display:flex;justify-content:center;padding:0}
  iframe{width:390px;height:844px;border:0;background:#fff;display:block}
</style>
</head>
<body>
<iframe id="f"></iframe>
<script>
  var f = document.getElementById('f');
  f.src = './index.html?v=' + Date.now();
  function jump() {
    try {
      var w = f.contentWindow;
      var el = w.document.getElementById('domBox');
      if (el) w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY - 74);
    } catch (e) {}
  }
  f.addEventListener('load', function () { setTimeout(jump, 1500); setTimeout(jump, 4000); });
</script>
</body>
</html>
