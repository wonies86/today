<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="국내 증시 장전·정규장·애프터장 3개 세션의 수급과 주도 테마를 한눈에 보는 라이트 모드 대시보드">
<title>🇰🇷 국내 증시 수급 대시보드</title>
<style>
  /* ============================================================
     디자인 토큰 — 라이트 · 고대비
     ============================================================ */
  :root{
    --bg:#f3f4f9;
    --bg-soft:#f8f9fc;
    --card:#ffffff;
    --line:#e3e7f0;
    --line-2:#edf0f6;
    --line-3:#dfe4ef;
    --ink:#101828;
    --ink-2:#44506a;
    --mute:#818da3;
    --up:#e11d48;            /* 상승 (한국식 빨강) */
    --up-soft:#fff1f4;
    --down:#2563eb;          /* 하락 (한국식 파랑) */
    --down-soft:#eef3ff;
    --violet:#6d28d9;
    --violet-2:#a855f7;
    --violet-soft:#f4efff;
    --rose:#be123c;
    --rose-soft:#fff1f5;
    --teal:#0f766e;
    --teal-soft:#e9f7f4;
    --amber:#b45309;
    --amber-soft:#fff6e8;
    --green:#15803d;
    --green-soft:#eefaf0;
    --slate:#64748b;
    --slate-soft:#f2f4f9;
    --radius:16px;
    --radius-sm:11px;
    --radius-xs:8px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 26px -20px rgba(16,24,40,.45);
    --shadow-2:0 1px 2px rgba(16,24,40,.05), 0 18px 34px -26px rgba(16,24,40,.5);
    --font:-apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
           "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", "Segoe UI",
           "Liberation Sans", system-ui, sans-serif;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(760px 420px at 8% -6%, rgba(109,40,217,.07), transparent 62%),
      radial-gradient(680px 380px at 98% -2%, rgba(37,99,235,.06), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font);
    font-size:15px;
    line-height:1.55;
    letter-spacing:-.01em;
    word-break:keep-all;
    overflow-wrap:break-word;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--violet);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:inherit}
  .wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 12px 64px}
  .up{color:var(--up)}
  .down{color:var(--down)}
  .flat{color:var(--mute)}

  /* ============================================================
     상단 고정 바 · 탭
     ============================================================ */
  .topbar{
    position:sticky;
    top:0;
    z-index:30;
    background:rgba(243,244,249,.94);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    margin:0 -12px;
    padding:0 12px;
  }
  .topbar-in{
    display:flex;
    align-items:center;
    gap:10px;
    max-width:980px;
    margin:0 auto;
    padding:9px 0 8px;
  }
  .brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto}
  .brand-mark{
    flex:0 0 auto;
    width:26px;height:26px;
    display:grid;place-items:center;
    font-size:14px;
    border-radius:9px;
    background:#fff;
    border:1px solid var(--line);
    box-shadow:var(--shadow);
  }
  .brand-name{
    font-size:13px;
    font-weight:800;
    letter-spacing:-.02em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .datechip{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:4px 9px;
    font-size:11.5px;
    font-weight:750;
    color:var(--ink-2);
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
  }
  .datechip .cal{font-size:10.5px;opacity:.7}
  .stampchip{
    flex:0 0 auto;
    font-size:10.5px;
    font-weight:650;
    color:var(--mute);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  /* 상단 새로고침 — 데이트 칩과 같은 알약형 토큰 */
  .refresh-btn{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    padding:4px 9px;
    min-height:26px;
    font-size:11.5px;
    font-weight:750;
    letter-spacing:-.01em;
    color:var(--ink-2);
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s ease,border-color .15s ease,color .15s ease,transform .12s ease;
  }
  .refresh-btn:hover{color:var(--ink);background:var(--bg-soft);border-color:var(--line-3)}
  .refresh-btn:active{transform:scale(.94)}
  .refresh-btn:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
  .refresh-btn .ic{display:block;line-height:1;transform-origin:50% 50%;flex:0 0 auto}
  .refresh-btn .lbl{line-height:1.2}
  .refresh-btn.is-spinning .ic{animation:spin .55s cubic-bezier(.4,0,.2,1)}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  .tabs{display:flex;gap:4px;padding:0 0 8px}
  .tab{
    flex:1 1 0;
    min-width:0;
    appearance:none;
    border:1px solid transparent;
    background:transparent;
    color:var(--ink-2);
    font-size:12.5px;
    font-weight:700;
    letter-spacing:-.02em;
    padding:8px 4px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .tab:hover{color:var(--ink);background:rgba(255,255,255,.7)}
  .tab[aria-selected="true"]{
    background:#fff;
    color:var(--ink);
    border-color:var(--line-3);
    box-shadow:0 1px 2px rgba(16,24,40,.06);
  }

  /* ============================================================
     시장 상태 바
     ============================================================ */
  .statusbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px 10px;
    margin:12px 0 0;
    padding:9px 12px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:13px;
    box-shadow:var(--shadow);
    font-size:12px;
    font-variant-numeric:tabular-nums;
  }
  .mkt-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:3px 8px;
    font-size:10.5px;
    font-weight:800;
    letter-spacing:.01em;
    color:#fff;
    background:linear-gradient(135deg,#e11d48,#f43f5e);
    border-radius:7px;
  }
  .mkt-badge.down{background:linear-gradient(135deg,#1d4ed8,#3b82f6)}
  .idxline{display:inline-flex;align-items:baseline;gap:4px;color:var(--ink-2);font-weight:650;white-space:nowrap}
  .idxline .v{color:var(--ink);font-weight:800;font-size:12.5px}
  .idxline .p{font-weight:800}
  .statusbar .sep{color:var(--line-3);font-weight:400}
  .statusbar .asof{margin-left:auto;color:var(--mute);font-size:11px;font-weight:650;white-space:nowrap}

  /* ============================================================
     세션 스위처
     ============================================================ */
  .session{
    margin:10px 0 0;
    padding:10px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .seg{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:4px;
    padding:3px;
    background:var(--bg-soft);
    border:1px solid var(--line-2);
    border-radius:11px;
  }
  .seg-btn{
    appearance:none;
    border:1px solid transparent;
    background:transparent;
    border-radius:8px;
    padding:7px 2px;
    cursor:pointer;
    text-align:center;
    line-height:1.15;
    color:var(--ink-2);
    transition:background .16s ease,color .16s ease,box-shadow .16s ease;
  }
  .seg-btn b{display:block;font-size:12px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
  .seg-btn i{display:block;margin-top:2px;font-style:normal;font-size:9.5px;font-weight:650;color:var(--mute);font-variant-numeric:tabular-nums}
  .seg-btn:hover{background:rgba(255,255,255,.8)}
  .seg-btn[aria-selected="true"]{
    background:linear-gradient(135deg,#6d28d9,#8b5cf6);
    color:#fff;
    box-shadow:0 6px 16px -10px rgba(109,40,217,.9);
  }
  .seg-btn[aria-selected="true"] i{color:rgba(255,255,255,.82)}

  .rail{position:relative;margin:14px 2px 0}
  .rail-track{display:flex;height:9px;gap:3px;border-radius:999px;background:var(--line-2);overflow:hidden}
  .rz{height:100%;background:#dde2ee;border-radius:3px;transition:background .2s ease}
  .rz.on{background:linear-gradient(90deg,#6d28d9,#a855f7)}
  .rz.gap{background:transparent;border-radius:0}
  .rail-mark{
    position:absolute;
    top:-3px;
    width:3px;
    height:15px;
    border-radius:2px;
    background:var(--violet);
    box-shadow:0 0 0 2.5px rgba(109,40,217,.16);
    transform:translateX(-50%);
    transition:left .26s cubic-bezier(.4,0,.2,1);
  }
  .rail-axis{position:relative;height:15px;margin-top:5px;font-size:10px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
  .rail-axis span{position:absolute;top:2px;white-space:nowrap}
  .rail-axis .a0{left:0}
  .rail-axis .a1{left:62.5%;transform:translateX(-50%)}
  .rail-axis .a2{left:100%;transform:translateX(-100%)}

  .strip{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    padding:8px 10px;
    background:var(--bg-soft);
    border:1px dashed var(--line-3);
    border-radius:10px;
    font-size:11.5px;
    font-weight:650;
    color:var(--ink-2);
    font-variant-numeric:tabular-nums;
  }
  .strip .dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--violet)}

  /* ============================================================
     공통 섹션 헤더
     ============================================================ */
  .sec{margin-top:22px;scroll-margin-top:92px}
  .sechead{display:flex;align-items:baseline;gap:8px;margin:0 2px 9px;flex-wrap:wrap}
  .sechead h2{
    margin:0;
    font-size:15px;
    font-weight:800;
    letter-spacing:-.03em;
  }
  .sechead .no{
    display:inline-block;
    padding:1px 6px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.02em;
    color:var(--violet);
    background:var(--violet-soft);
    border-radius:6px;
    vertical-align:1px;
  }
  .sechead p{margin:0;font-size:11.5px;color:var(--mute);font-weight:600}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}

  /* ============================================================
     주도 섹터 카드
     ============================================================ */
  .scard{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
    min-width:0;
  }
  .scard-head{
    display:flex;
    align-items:flex-start;
    gap:6px;
    min-height:52px;
    padding:8px 10px 7px;
    color:#fff;
  }
  .scard.a-violet .scard-head{background:linear-gradient(135deg,#6d28d9,#a855f7)}
  .scard.a-rose .scard-head{background:linear-gradient(135deg,#9f1239,#f43f5e)}
  .scard.a-teal .scard-head{background:linear-gradient(135deg,#0f766e,#14b8a6)}
  .scard.a-amber .scard-head{background:linear-gradient(135deg,#b45309,#f59e0b)}
  .scard.a-indigo .scard-head{background:linear-gradient(135deg,#312e81,#6366f1)}
  .scard-head .medal{font-size:16px;line-height:1.1;flex:0 0 auto;margin-top:-1px}
  .scard-head .cname{
    flex:1 1 auto;
    min-width:0;
    font-size:12.5px;
    font-weight:850;
    letter-spacing:-.02em;
    line-height:1.3;
    text-shadow:0 1px 1px rgba(0,0,0,.12);
  }
  .scard-head .cmetric{flex:0 0 auto;text-align:right;line-height:1.2}
  .scard-head .cmain{display:block;font-size:13px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .scard-head .csub{display:block;margin-top:1px;font-size:9.5px;font-weight:650;color:rgba(255,255,255,.86);font-variant-numeric:tabular-nums}
  .scard-issue{
    padding:7px 10px 6px;
    font-size:11px;
    font-weight:650;
    line-height:1.42;
    color:var(--ink-2);
    background:var(--bg-soft);
    border-bottom:1px solid var(--line-2);
  }
  .scard-issue b{color:var(--ink);font-weight:800}
  .scard-rows{padding:4px 10px 2px}
  .srow{
    display:grid;
    grid-template-columns:minmax(0,1fr) 40px auto;
    align-items:center;
    gap:6px;
    padding:5px 0;
    border-bottom:1px solid var(--line-2);
  }
  .srow:last-child{border-bottom:0}
  .sname{min-width:0;display:flex;flex-direction:column;gap:0}
  .sname b{
    display:block;
    font-size:11.5px;
    font-weight:750;
    letter-spacing:-.03em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .sname span{font-size:9.5px;color:var(--mute);font-variant-numeric:tabular-nums;font-weight:600}
  .sbar{height:5px;border-radius:3px;background:var(--line-2);position:relative;overflow:hidden}
  .sbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--up);opacity:.85}
  .sbar i.down{background:var(--down)}
  .sval{text-align:right;line-height:1.2;white-space:nowrap}
  .sval b{display:block;font-size:11.5px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .sval span{display:block;font-size:9.5px;color:var(--mute);font-weight:650;font-variant-numeric:tabular-nums}
  .scard-foot{padding:6px 10px 8px;font-size:9.5px;color:var(--mute);font-weight:600;letter-spacing:-.01em}
  .scard-stats{padding:2px 10px 4px}
  .sstat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-2)}
  .sstat:last-child{border-bottom:0}
  .sstat .k{font-size:10.5px;color:var(--mute);font-weight:650}
  .sstat .v{font-size:14px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .scard-notes{padding:2px 10px 6px;margin:0;list-style:none}
  .scard-notes li{position:relative;padding:4px 0 4px 11px;font-size:10.5px;line-height:1.45;color:var(--ink-2);font-weight:600}
  .scard-notes li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--violet)}
  .cta-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .cta{
    appearance:none;
    padding:10px 8px;
    font-size:11.5px;
    font-weight:750;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line-3);
    border-radius:12px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .cta:hover{border-color:var(--violet);color:var(--violet)}
  .sen-note{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    padding:8px 10px;
    background:var(--violet-soft);
    border:1px solid #e3d8ff;
    border-radius:10px;
    font-size:10.5px;
    font-weight:650;
    color:#4c1d95;
  }

  /* ============================================================
     랭킹 열 (확산 / 자금)
     ============================================================ */
  .rankcol{min-width:0}
  .grid2 > *{min-width:0}
  .colhead{display:flex;align-items:center;gap:5px;margin:0 2px 6px;min-width:0}
  .colhead .caret{font-size:9px;color:var(--mute)}
  .colhead h3{margin:0;font-size:12.5px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
  .colhead .unit{font-size:10px;color:var(--mute);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .colhead .cnt{margin-left:auto;font-size:10px;font-weight:750;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-variant-numeric:tabular-nums}
  .colsub{margin:0 2px 6px;font-size:9.5px;color:var(--mute);font-weight:600}

  .share{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 9px;
    box-shadow:var(--shadow);
    margin-bottom:7px;
  }
  .share-top{display:flex;align-items:center;gap:5px;margin-bottom:6px;min-width:0}
  .share-mode{
    flex:0 0 auto;
    padding:2px 7px;
    font-size:9.5px;
    font-weight:800;
    color:#fff;
    background:var(--violet);
    border-radius:6px;
  }
  .share-mode.v{background:var(--ink)}
  .share-cap{font-size:9.5px;font-weight:650;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .share-bar{display:flex;gap:2px;height:22px;border-radius:7px;overflow:hidden;background:var(--line-2)}
  .share-bar i{
    display:grid;
    place-items:center;
    min-width:0;
    font-size:9px;
    font-weight:800;
    color:#fff;
    font-variant-numeric:tabular-nums;
    overflow:hidden;
  }
  .share-bar i.semi{background:linear-gradient(135deg,#4f46e5,#6366f1)}
  .share-bar i.parts{background:linear-gradient(135deg,#be123c,#f43f5e)}
  .share-bar i.enter{background:linear-gradient(135deg,#b45309,#f59e0b)}
  .share-bar i.robot{background:linear-gradient(135deg,#0f766e,#14b8a6)}
  .share-bar i.bio{background:linear-gradient(135deg,#15803d,#22c55e)}
  .share-bar i.etc{background:linear-gradient(135deg,#94a3b8,#cbd5e1)}
  .share-legend{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px}
  .share-legend span{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .share-legend i{width:6px;height:6px;border-radius:2px;display:inline-block}
  .share-legend i.semi{background:#4f46e5}
  .share-legend i.parts{background:#f43f5e}
  .share-legend i.enter{background:#f59e0b}
  .share-legend i.robot{background:#14b8a6}
  .share-legend i.bio{background:#22c55e}
  .share-legend i.etc{background:#cbd5e1}
  .share-note{margin:5px 0 0;font-size:9.5px;line-height:1.4;color:var(--mute);font-weight:600}

  .rk{
    position:relative;
    display:grid;
    grid-template-columns:16px minmax(0,1fr) auto;
    grid-template-areas:"no nm pill" "no chg tv";
    gap:1px 6px;
    padding:7px 9px 7px 8px;
    margin-bottom:5px;
    background:#fff;
    border:1px solid var(--line);
    border-left:3px solid var(--line-3);
    border-radius:10px;
    box-shadow:0 1px 1px rgba(16,24,40,.03);
    min-width:0;
  }
  .rk.g-semi{border-left-color:#4f46e5;background:linear-gradient(180deg,#f7f7ff,#fff 58%)}
  .rk.g-parts{border-left-color:#f43f5e;background:linear-gradient(180deg,#fff5f7,#fff 58%)}
  .rk.g-enter{border-left-color:#f59e0b;background:linear-gradient(180deg,#fffaf0,#fff 58%)}
  .rk.g-robot{border-left-color:#14b8a6;background:linear-gradient(180deg,#f2fdfb,#fff 58%)}
  .rk.g-bio{border-left-color:#22c55e;background:linear-gradient(180deg,#f4fdf6,#fff 58%)}
  .rk-no{
    grid-area:no;
    align-self:start;
    padding-top:1px;
    font-size:10px;
    font-weight:850;
    color:var(--mute);
    font-variant-numeric:tabular-nums;
  }
  .rk-nm{
    grid-area:nm;
    min-width:0;
    font-size:11.5px;
    font-weight:750;
    letter-spacing:-.03em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .rk-pill{
    grid-area:pill;
    justify-self:end;
    align-self:center;
    max-width:74px;
    padding:1.5px 6px;
    font-size:9px;
    font-weight:800;
    color:#fff;
    border-radius:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .rk-pill.semi{background:#4f46e5}
  .rk-pill.parts{background:#e11d48}
  .rk-pill.enter{background:#d97706}
  .rk-pill.robot{background:#0f766e}
  .rk-pill.bio{background:#15803d}
  .rk-pill.etc{background:#64748b}
  .rk-chg{
    grid-area:chg;
    font-size:12px;
    font-weight:850;
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
    line-height:1.35;
  }
  .rk-tv{
    grid-area:tv;
    justify-self:end;
    align-self:end;
    font-size:9.5px;
    font-weight:650;
    color:var(--mute);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .rk-tv em{font-style:normal;color:var(--violet);font-weight:750}

  .more{
    display:block;
    width:100%;
    appearance:none;
    padding:8px;
    font-size:10.5px;
    font-weight:700;
    color:var(--ink-2);
    background:#fff;
    border:1px solid var(--line);
    border-radius:9px;
    cursor:pointer;
  }
  .more:hover{border-color:var(--line-3);background:var(--bg-soft)}

  /* ============================================================
     시장 맥락
     ============================================================ */
  .ctxgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:10px;align-items:start}
  .ctxmain{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    box-shadow:var(--shadow);
  }
  .ctx-kicker{
    display:inline-block;
    padding:2px 8px;
    margin-bottom:8px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.02em;
    color:var(--violet);
    background:var(--violet-soft);
    border-radius:6px;
  }
  .ctxmain h3{
    margin:0 0 12px;
    font-size:15px;
    font-weight:800;
    line-height:1.5;
    letter-spacing:-.03em;
  }
  .ctxmain h3 em{font-style:normal;color:var(--up);background:linear-gradient(180deg,transparent 62%,#ffe4ea 62%)}
  .reason{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line-2)}
  .reason:first-of-type{border-top:0;padding-top:2px}
  .reason-num{
    flex:0 0 auto;
    width:19px;height:19px;
    display:grid;place-items:center;
    font-size:10px;
    font-weight:850;
    color:#fff;
    background:var(--ink);
    border-radius:6px;
  }
  .reason-body{min-width:0}
  .reason-body strong{display:block;font-size:12px;font-weight:800;letter-spacing:-.02em;margin-bottom:2px;line-height:1.4}
  .reason-body p{margin:0;font-size:11.5px;line-height:1.55;color:var(--ink-2);font-weight:550}

  .ctxside{display:flex;flex-direction:column;gap:8px;min-width:0}
  .flowcard{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    box-shadow:var(--shadow);
  }
  .flowcard h4{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:-.02em}
  .flow{margin-bottom:10px}
  .flow:last-child{margin-bottom:0}
  .flow-head{display:flex;align-items:baseline;gap:6px;margin-bottom:5px}
  .flow-head b{font-size:11.5px;font-weight:800}
  .flow-head span{font-size:9.5px;color:var(--mute);font-weight:600}
  .flow-row{
    display:grid;
    grid-template-columns:34px minmax(0,1fr) 62px;
    align-items:center;
    gap:6px;
    padding:2.5px 0;
  }
  .flow-name{font-size:10px;font-weight:700;color:var(--ink-2)}
  .flow-track{height:7px;border-radius:4px;background:var(--bg-soft);position:relative;border:1px solid var(--line-2)}
  .flow-track i{position:absolute;top:0;bottom:0;border-radius:3px}
  .flow-track i.up{background:linear-gradient(90deg,#f43f5e,#e11d48)}
  .flow-track i.down{background:linear-gradient(90deg,#3b82f6,#2563eb)}
  .flow-val{font-size:10px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}

  .ctxbox{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
  .ctxbox h4{margin:0 0 6px;font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ctxbox .tagline{font-size:9px;font-weight:750;color:var(--mute);background:var(--bg-soft);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px}
  .ctxbox p{margin:0 0 6px;font-size:11px;line-height:1.55;color:var(--ink-2);font-weight:550}
  .ctxbox p:last-child{margin-bottom:0}
  .ctxbox.next{border-color:#e3d8ff;background:linear-gradient(180deg,#faf7ff,#fff 46%)}
  .ctxbox.next .tagline{color:#6d28d9;background:#f4efff;border-color:#e3d8ff}
  .ctxbox ul{margin:0;padding-left:0;list-style:none}
  .ctxbox li{position:relative;padding:3px 0 3px 11px;font-size:11px;line-height:1.5;color:var(--ink-2);font-weight:550}
  .ctxbox li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--violet)}

  /* ============================================================
     관찰 5선
     ============================================================ */
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
  .pick{
    appearance:none;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:11px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    cursor:pointer;
    transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease;
    min-width:0;
    font-family:inherit;
  }
  .pick:hover{border-color:#d6c9f7;box-shadow:var(--shadow-2);transform:translateY(-1px)}
  .pick:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
  .pick-top{display:flex;align-items:flex-start;gap:7px;min-width:0}
  .pick-rank{
    flex:0 0 auto;
    width:20px;height:20px;
    display:grid;place-items:center;
    font-size:10px;font-weight:850;
    color:#fff;
    background:var(--ink);
    border-radius:6px;
    font-variant-numeric:tabular-nums;
  }
  .pick-main{flex:1 1 auto;min-width:0}
  .pick-name{
    display:block;
    font-size:13px;
    font-weight:800;
    letter-spacing:-.03em;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pick-meta{display:flex;flex-wrap:wrap;gap:2px 7px;font-size:9.5px;color:var(--mute);font-weight:650;font-variant-numeric:tabular-nums}
  .pick-meta b{color:var(--ink-2);font-weight:750}
  .pick-chg{
    flex:0 0 auto;
    font-size:14px;
    font-weight:850;
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
  }
  .pick-why{font-size:10.5px;line-height:1.5;color:var(--ink-2);font-weight:550;margin:0}
  .pick-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:2px}
  .pick-hint{
    display:inline-flex;align-items:center;gap:3px;
    font-size:9.5px;font-weight:750;color:var(--violet);
    background:var(--violet-soft);
    border-radius:5px;
    padding:2.5px 6px;
  }
  .pick-sector{font-size:9px;font-weight:750;color:var(--mute)}

  /* ============================================================
     기사 · 파이프라인 · 푸터
     ============================================================ */
  .articles{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
  .article{
    display:flex;
    gap:9px;
    padding:11px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:13px;
    box-shadow:var(--shadow);
    min-width:0;
  }
  .article:hover{border-color:#d6c9f7;text-decoration:none}
  .article-mark{
    flex:0 0 auto;
    align-self:flex-start;
    padding:2px 7px;
    font-size:9.5px;
    font-weight:800;
    color:#fff;
    background:var(--ink);
    border-radius:5px;
    white-space:nowrap;
  }
  .article-body{min-width:0}
  .article-src{display:block;font-size:9.5px;font-weight:750;color:var(--violet)}
  .article-title{display:block;font-size:11.5px;font-weight:750;line-height:1.45;color:var(--ink);margin:1px 0 2px;letter-spacing:-.02em}
  .article-url{display:block;font-size:9.5px;color:var(--mute);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .pipe{display:flex;flex-wrap:wrap;gap:5px;margin-top:20px}
  .pchip{
    display:inline-flex;align-items:center;gap:5px;
    padding:5px 9px;
    font-size:10px;font-weight:700;
    color:var(--ink-2);
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    font-variant-numeric:tabular-nums;
  }
  .pchip b{font-weight:850;color:var(--ink)}
  .pchip .st{font-size:8.5px;font-weight:800;padding:1px 5px;border-radius:4px;color:#fff}
  .pchip .st.done{background:#0f766e}
  .pchip .st.scheduled{background:#b45309}
  .pchip .st.waiting{background:#64748b}

  .foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
  .disclaimer{font-size:10.5px;line-height:1.6;color:var(--mute);font-weight:600;margin:0 0 8px}
  .disclaimer b{color:var(--ink-2)}
  .fmeta{display:flex;flex-wrap:wrap;gap:4px 6px}
  .fmeta span{
    font-size:9.5px;
    font-weight:650;
    color:var(--mute);
    background:#fff;
    border:1px solid var(--line);
    border-radius:6px;
    padding:2px 6px;
    font-variant-numeric:tabular-nums;
  }

  /* ============================================================
     차트 기술적 분석 모달
     ============================================================ */
  body.ta-lock{overflow:hidden}
  .ta-dialog{
    width:min(680px, calc(100vw - 20px));
    max-height:88vh;
    padding:0;
    border:1px solid var(--line);
    border-radius:18px;
    background:#fff;
    color:var(--ink);
    box-shadow:0 30px 60px -24px rgba(16,24,40,.45);
    overflow:hidden;
  }
  .ta-dialog::backdrop{background:rgba(16,24,40,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .ta-head{
    display:flex;
    align-items:center;
    gap:9px;
    padding:13px 14px 11px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#faf7ff,#fff);
  }
  .ta-rank{
    flex:0 0 auto;
    width:24px;height:24px;
    display:grid;place-items:center;
    font-size:11px;font-weight:850;
    color:#fff;
    background:linear-gradient(135deg,#6d28d9,#8b5cf6);
    border-radius:7px;
    font-variant-numeric:tabular-nums;
  }
  .ta-head-main{flex:1 1 auto;min-width:0}
  .ta-title{margin:0;font-size:16px;font-weight:850;letter-spacing:-.03em;line-height:1.25}
  .ta-id{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
  .ta-id span{
    font-size:9.5px;font-weight:750;color:var(--ink-2);
    background:var(--bg-soft);border:1px solid var(--line-2);
    border-radius:4px;padding:1px 5px;
    font-variant-numeric:tabular-nums;
  }
  .ta-x{
    flex:0 0 auto;
    width:29px;height:29px;
    appearance:none;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-2);
    font-size:13px;
    border-radius:9px;
    cursor:pointer;
    line-height:1;
  }
  .ta-x:hover{background:var(--bg-soft);color:var(--ink)}
  .ta-scroll{overflow-y:auto;max-height:calc(88vh - 128px);padding:13px 14px 4px;-webkit-overflow-scrolling:touch}
  .ta-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .ta-price b{font-size:23px;font-weight:850;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
  .ta-price .chg{font-size:14px;font-weight:850;font-variant-numeric:tabular-nums}
  .ta-basis{font-size:10.5px;color:var(--mute);font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
  .ta-chips{display:flex;flex-wrap:wrap;gap:4px;margin:9px 0 11px}
  .ta-chip{
    font-size:10px;font-weight:700;color:var(--ink-2);
    background:var(--bg-soft);border:1px solid var(--line-2);
    border-radius:6px;padding:2.5px 7px;
    font-variant-numeric:tabular-nums;
  }
  .ta-chip b{color:var(--ink);font-weight:850}
  .ta-range{background:var(--bg-soft);border:1px solid var(--line-2);border-radius:11px;padding:9px 11px;margin-bottom:13px}
  .ta-range-head{display:flex;justify-content:space-between;gap:8px;font-size:9.5px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
  .ta-range-head b{color:var(--ink-2);font-weight:850}
  .ta-track{position:relative;height:7px;margin:8px 0 7px;background:linear-gradient(90deg,#fde3e9,#eef3ff);border-radius:4px}
  .ta-track .mk{position:absolute;top:-3px;width:2px;height:13px;background:var(--ink-2);border-radius:1px;transform:translateX(-50%);opacity:.5}
  .ta-track .now{position:absolute;top:-4px;width:10px;height:15px;background:var(--up);border-radius:3px;transform:translateX(-50%);box-shadow:0 0 0 2px #fff}
  .ta-range-foot{display:flex;justify-content:space-between;gap:8px;font-size:9.5px;font-weight:650;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .ta-range-foot i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px;vertical-align:0}
  .ta-range-foot .k-mk{background:var(--ink-2);opacity:.5}
  .ta-range-foot .k-now{background:var(--up)}
  .ta-sec{margin-bottom:13px}
  .ta-sec-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
  .ta-sec-head h4{margin:0;font-size:11.5px;font-weight:850;letter-spacing:-.02em}
  .ta-bar{width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,#6d28d9,#a855f7)}
  .ta-tag{margin-left:auto;font-size:9px;font-weight:700;color:var(--mute);background:var(--bg-soft);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px}
  .ta-para{margin:0 0 8px;font-size:11.5px;line-height:1.62;color:var(--ink-2);font-weight:550}
  .ta-blocks{display:flex;flex-direction:column;gap:5px}
  .ta-block{display:flex;flex-direction:column;gap:2px;padding:8px 9px;background:var(--bg-soft);border:1px solid var(--line-2);border-radius:9px}
  .ta-block .k{font-size:9.5px;font-weight:800;color:var(--violet)}
  .ta-block .v{font-size:10.5px;line-height:1.55;color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
  .ta-block.is-sup{border-color:#cdeee6;background:#f1fbf8}
  .ta-block.is-sup .k{color:#0f766e}
  .ta-block.is-res{border-color:#fbd9e1;background:#fff5f7}
  .ta-block.is-res .k{color:#be123c}
  .ta-block.is-key{border-color:#e3d8ff;background:var(--violet-soft)}
  .ta-block.is-key .k{color:#6d28d9}
  .ta-signals{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .ta-sig{padding:6px 8px;background:var(--bg-soft);border:1px solid var(--line-2);border-radius:8px;min-width:0}
  .ta-sig .k{font-size:9px;font-weight:800;color:var(--mute)}
  .ta-sig .v{font-size:10px;font-weight:700;color:var(--ink);line-height:1.4;font-variant-numeric:tabular-nums}
  .ta-note{margin:8px 0 0;font-size:9px;line-height:1.55;color:var(--mute);font-weight:600}
  .ta-foot{padding:10px 14px 12px;border-top:1px solid var(--line);background:var(--bg-soft);font-size:9.5px;line-height:1.5;color:var(--mute);font-weight:600}

  /* ============================================================
     반응형
     ============================================================ */
  @media (max-width:640px){
    body{font-size:14px}
    .wrap{padding:0 10px 56px}
    .topbar{margin:0 -10px;padding:0 10px}
    .brand-name{font-size:12px}
    .topbar-in{gap:8px}
    /* 좁은 화면에서는 아이콘만 — aria-label 로 이름 유지 */
    .refresh-btn{width:26px;height:26px;padding:0}
    .refresh-btn .lbl{display:none}
    .tabs{gap:3px}
    .tab{font-size:11.5px;padding:7px 3px}
    .statusbar{padding:8px 10px;gap:5px 8px;font-size:11.5px}
    .idxline .v{font-size:12px}
    .grid2{gap:7px}
    .scard-head{padding:7px 8px 6px}
    .scard-head .cname{font-size:11.5px}
    .scard-head .cmain{font-size:12px}
    .scard-rows{padding:3px 8px 2px}
    .srow{grid-template-columns:minmax(0,1fr) 32px auto;gap:5px}
    .sname b{font-size:11px}
    .share{padding:7px 8px}
    .rk{padding:6px 8px 6px 7px}
    .rk-nm{font-size:11px}
    .rk-chg{font-size:11.5px}
    .ctxgrid{grid-template-columns:1fr}
    .picks{grid-template-columns:1fr}
    .articles{grid-template-columns:1fr}
    .ta-dialog{width:calc(100vw - 12px);max-height:92vh;border-radius:16px}
    .ta-scroll{max-height:calc(92vh - 124px)}
  }
  @media (max-width:359px){
    /* 아주 좁은 화면: 브랜드명 대신 마크만 — 칩들이 겹치지 않게 */
    .brand-name{display:none}
  }
  @media (min-width:900px){
    .wrap{max-width:980px;padding:0 24px 72px}
    .topbar{margin:0 -24px;padding:0 24px}
    .topbar-in{padding:12px 0 10px}
    .tabs{max-width:620px;margin:0 auto;gap:6px;padding-bottom:10px}
    .tab{font-size:13px;padding:9px 6px}
    .grid2{gap:12px}
    .scard-head{padding:11px 13px 10px;min-height:60px}
    .scard-head .cname{font-size:14px}
    .scard-head .cmain{font-size:15px}
    .scard-head .csub{font-size:10.5px}
    .scard-issue{font-size:12px;padding:9px 13px}
    .scard-rows{padding:5px 13px 3px}
    .srow{padding:7px 0;grid-template-columns:minmax(0,1fr) 64px 96px}
    .sname b{font-size:13px}
    .sname span{font-size:10.5px}
    .sval b{font-size:13px}
    .sval span{font-size:10.5px}
    .scard-foot{padding:8px 13px 10px;font-size:10.5px}
    .share{padding:11px 12px}
    .share-bar{height:26px}
    .rk{padding:9px 11px;grid-template-columns:20px minmax(0,1fr) auto;margin-bottom:6px}
    .rk-nm{font-size:12.5px}
    .rk-chg{font-size:13.5px}
    .colhead h3{font-size:13.5px}
    .pick{padding:14px}
    .pick-name{font-size:14.5px}
    .pick-chg{font-size:16px}
    .pick-why{font-size:11.5px}
    .ctxmain{padding:18px}
    .ctxmain h3{font-size:17px}
    .reason-body strong{font-size:13px}
    .reason-body p{font-size:12.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ======================= 상단 바 ======================= -->
  <div class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🇰🇷</span>
        <span class="brand-name">국내 증시 수급 대시보드</span>
      </div>
      <button type="button" class="datechip" id="dateChip">
        <span class="cal" aria-hidden="true">📅</span><span id="dateChipLabel">—</span>
      </button>
      <span class="stampchip" id="stampChip">—</span>
      <button type="button" class="refresh-btn" id="btn-refresh"
              aria-label="최신 화면 새로고침" title="최신 화면 새로고침">
        <svg class="ic" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 12a8.5 8.5 0 1 1-2.9-6.4"/><path d="M20.6 4.2v5.2h-5.2"/>
        </svg><span class="lbl">새로고침</span>
      </button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="세션 선택"></nav>
  </div>

  <!-- ======================= 시장 상태 ======================= -->
  <div class="statusbar" id="statusbar"></div>

    const chip = $("#dateChip");
    const sorted = REPORT_DATA.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    chip.disabled = sorted.length < 2;
    chip.style.cursor = sorted.length < 2 ? "default" : "pointer";
    chip.onclick = () => {
      if (sorted.length < 2) return;
      const idx = sorted.findIndex((r) => r.date === activeDate);
      activeDate = sorted[(idx + 1) % sorted.length].date;
      const next = findReport(activeDate);
      setSession((next && next.defaultSession) || "aft", true);

  /* ---------------- 세션 스위처 ---------------- */
  function renderSwitcher(report) {
    const seg = $("#seg");
    seg.innerHTML = "";
    (report.sessions || []).forEach((s) => {
      const b = el("button", "seg-btn");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(s.key === activeSession));
      b.innerHTML = "<b>" + esc(s.code) + "</b><i>" + esc(s.window) + "</i>";
      b.addEventListener("click", () => setSession(s.key));
      seg.appendChild(b);
    });
    syncSwitcher(report);

  function syncSwitcher(report) {
    const s = sessionOf(report);
    if (!s) return;
    Array.prototype.forEach.call($("#seg").children, (node) => {
      node.setAttribute("aria-selected", String(node.querySelector("b").textContent === s.code));
    });
    Array.prototype.forEach.call($("#tabs").children, (node) => {
      const tabName = s.tab || s.name;
      node.setAttribute("aria-selected", String(node.textContent === tabName));
    });
    Array.prototype.forEach.call($("#railTrack").children, (node) => {
      const z = node.getAttribute("data-z");
      if (!z) return;
      if (z === s.key) node.classList.add("on");
      else node.classList.remove("on");
    });
    const mark = $("#railMark");
    const fromWin = MARK_BY_WINDOW(s.window);
    const left = fromWin != null ? fromWin : (MARK[s.key] == null ? 100 : MARK[s.key]);
    mark.style.left = left + "%";
    $("#strip").innerHTML = '<span class="dot" aria-hidden="true"></span><span>' + esc(s.strip || "") + "</span>";
  }

  function setSession(key, resetDate) {
    activeSession = key;
    expanded = { up: false, value: false };
    if (resetDate) {
      /* 날짜를 바꾸면 날짜 단위 섹션(맥락·관찰·기사·푸터)까지 모두 다시 그린다 */
      render();
      return;
    }
    const report = findReport(activeDate);
    syncSwitcher(report);
    renderSessionBody(report);
  }

  /* ---------------- 섹터 카드 ---------------- */
  function sectorCard(card, maxAbs) {
    const cls = "scard a-" + (card.accent || "violet");
    const n = el("article", cls);
    let h = '<div class="scard-head">' +
      '<span class="medal" aria-hidden="true">' + esc(card.medal || "") + "</span>" +
      '<span class="cname">' + esc(card.name) + "</span>" +
      '<span class="cmetric">' +
        (card.cmain ? '<span class="cmain">' + esc(card.cmain) + "</span>" : "") +
        (card.csub ? '<span class="csub">' + esc(card.csub) + "</span>" : "") +
      "</span>" +
    "</div>";
    if (card.issue) h += '<div class="scard-issue">' + card.issue + "</div>";

    if (card.stats && card.stats.length) {
      h += '<div class="scard-stats">';
      card.stats.forEach((st) => {
        h += '<div class="sstat"><span class="k">' + esc(st.k) + '</span>' +
          '<span class="v ' + esc(st.cls || "") + '">' + esc(st.v) + "</span></div>";
      });
      h += "</div>";
    }

    if (card.stocks && card.stocks.length) {
      h += '<div class="scard-rows">';
      card.stocks.forEach((st) => {
        const w = Math.max(4, Math.min(50, (Math.abs(st.chg) / maxAbs) * 50));
        const side = st.chg >= 0 ? "left:50%" : "right:50%";
        h += '<div class="srow">' +
          '<span class="sname"><b>' + esc(st.name) + "</b>" +
            (st.price ? "<span>" + esc(st.price) + "</span>" : "<span>&nbsp;</span>") +
          "</span>" +
          '<span class="sbar" aria-hidden="true"><i class="' + dir(st.chg) + '" style="' + side + ";width:" + w.toFixed(1) + '%"></i></span>' +
          '<span class="sval"><b class="' + dir(st.chg) + '">' + pct(st.chg) + "</b>" +
            (st.turnover ? "<span>" + esc(st.turnover) + "</span>" : "<span>&nbsp;</span>") +
          "</span>" +
        "</div>";
      });
      h += "</div>";
    }

    if (card.notes && card.notes.length) {
      h += '<ul class="scard-notes">';
      card.notes.forEach((t) => { h += "<li>" + esc(t) + "</li>"; });
      h += "</ul>";
    }

    if (card.foot) h += '<div class="scard-foot">' + esc(card.foot) + "</div>";
    n.innerHTML = h;
    return n;
  }

  /* ---------------- 확산·자금 비중 바 ---------------- */
  function shareBlock(col) {
    const items = col.items || [];
    const totals = {};
    GROUPS.forEach((g) => { totals[g.key] = 0; });
    const usedGroups = {};
    items.forEach((it) => {
      const k = totals[it.g] == null ? "etc" : it.g;
      usedGroups[k] = true;
      totals[k] += col.kind === "value" ? (it.eok || 0) : 1;
    });
    const total = col.kind === "value"
      ? Object.keys(totals).reduce((a, k) => a + totals[k], 0)
      : items.length;
    if (!total) return "";

    const parts = GROUPS.filter((g) => usedGroups[g.key])
      .map((g) => ({
        key: g.key,
        label: g.label,
        share: totals[g.key] / total * 100,
        raw: totals[g.key]
      }))
      .sort((a, b) => b.share - a.share);
    const top = parts.slice(0, 3);
    const rest = parts.slice(3);
    const restShare = rest.reduce((a, p) => a + p.share, 0);
    const segs = top.concat(restShare > 0.4 ? [{ key: "etc", label: "기타", share: restShare }] : []);

    let bar = '<div class="share-bar" aria-hidden="true">';
    segs.forEach((sg) => {
      bar += '<i class="' + esc(sg.key) + '" style="flex:' + sg.share.toFixed(2) + ' 1 0">' +
        (sg.share >= 13 ? Math.round(sg.share) + "%" : "") + "</i>";
    });
    bar += "</div>";

    let legend = '<div class="share-legend">';
    segs.forEach((sg) => {
      legend += "<span><i class=\"" + esc(sg.key) + "\"></i>" + esc(sg.label) + " " + Math.round(sg.share) + "%</span>";
    });
    legend += "</div>";

    const lead = segs[0];
    const note = col.kind === "value"
      ? "거래대금 상위 " + items.length + "종목 중 " + esc(lead.label) + " " + Math.round(lead.share) + "% — 자금이 몰린 쪽"
      : "상승률 상위 " + items.length + "종목 중 " + esc(lead.label) + " " + Math.round(lead.share) + "% — 확산된 쪽";

    return '<div class="share">' +
      '<div class="share-top">' +
        '<span class="share-mode' + (col.kind === "value" ? " v" : "") + '">' + esc(col.tag) + "</span>" +
        '<span class="share-cap">' + esc(col.caption) + "</span>" +
      "</div>" + bar + legend +
      '<p class="share-note">' + note + "</p>" +
    "</div>";
  }

  /* ---------------- 랭킹 열 ---------------- */
  function rankColumn(col, key) {
    const wrap = el("div", "rankcol");
    let h = '<div class="colhead">' +
      '<span class="caret" aria-hidden="true">▼</span>' +
      "<h3>" + esc(col.title) + "</h3>" +

    '<p class="colsub">' + esc(col.sub || "") + "</p>" +

    const items = col.items || [];
    const shown = expanded[key] ? items : items.slice(0, 5);
    shown.forEach((it, i) => {
      h += '<div class="rk g-' + esc(it.g || "etc") + '">' +
        '<span class="rk-no">' + (i + 1) + "</span>" +
        '<span class="rk-nm">' + esc(it.name) + "</span>" +

  /* ---------------- 세션 본문 ---------------- */
  function renderSessionBody(report) {
    const s = sessionOf(report);
    const box = $("#sessionBody");
    box.innerHTML = "";
    if (!s) return;

    const sec = el("section", "sec");
    let maxAbs = 1;
    (s.cards || []).forEach((c) => {
      (c.stocks || []).forEach((st) => {
        maxAbs = Math.max(maxAbs, Math.abs(st.chg));
      });
    });
    maxAbs = Math.min(maxAbs, 30);

    const secInner = el("div");
    secInner.innerHTML = '<div class="sechead"><span class="no">01</span><h2>' +
      esc(s.name) + " 주도 섹터</h2><p>" + esc(s.window) + " · " +
      (s.mode === "summary" ? "요약 지표" : "상위 2개 섹터") + "</p></div>";
    const g2 = el("div", "grid2");
    (s.cards || []).forEach((c) => g2.appendChild(sectorCard(c, maxAbs)));
    secInner.appendChild(g2);
    sec.appendChild(secInner);

    if (s.mode === "summary") {
      if (s.note) sec.appendChild(el("div", "sen-note", esc(s.note)));
      if (s.noCta) { box.appendChild(sec); return; }
      const cta = el("div", "cta-row");
      const b1 = el("button", "cta", "정규장 수급 보기 →");
      b1.type = "button";
      b1.addEventListener("click", () => setSession("krx"));
      const b2 = el("button", "cta", "애프터장 테마 보기 →");
      b2.type = "button";
      b2.addEventListener("click", () => setSession("aft"));
      cta.appendChild(b1);
      cta.appendChild(b2);
      sec.appendChild(cta);
    } else {
      const cols = el("div", "grid2");
      cols.style.marginTop = "12px";
      if (s.up) cols.appendChild(rankColumn(s.up, "up"));
      if (s.value) cols.appendChild(rankColumn(s.value, "value"));
      sec.appendChild(cols);
      cols.addEventListener("click", (e) => {
        const btn = e.target.closest(".more");
        if (!btn) return;
        const k = btn.getAttribute("data-col");
        expanded[k] = !expanded[k];
        renderSessionBody(report);
      });
    }

    box.appendChild(sec);
  }

  /* ---------------- 관찰 5선 + 모달 ---------------- */
  function rangeBar(d, labels) {
    if (!d || !(d.high > d.low)) return "";
    const L = labels || {};
    const clamp = (v) => Math.min(d.high, Math.max(d.low, v));
    const pos = (v) => ((clamp(v) - d.low) / (d.high - d.low)) * 100;
    return (
      '<div class="ta-range">' +
        '<div class="ta-range-head"><span>' + esc(L.title || "당일 정규장 범위") + "</span>" +
          "<span><b>" + num(d.low) + "</b> ~ <b>" + num(d.high) + "</b></span></div>" +
        '<div class="ta-track" aria-hidden="true">' +
          '<span class="mk" style="left:' + pos(d.open).toFixed(2) + '%"></span>' +
          '<span class="now" style="left:' + pos(d.close).toFixed(2) + '%"></span>' +
        "</div>" +
        '<div class="ta-range-foot">' +
          '<span><i class="k-mk" aria-hidden="true"></i>시가 ' + num(d.open) + "</span>" +
          '<span><i class="k-now" aria-hidden="true"></i>' + esc(L.close || "종가") + " " + num(d.close) + "</span>" +
        "</div>" +
      "</div>"
    );
  }

    });
    dlg.addEventListener("close", () => {
      document.body.classList.remove("ta-lock");
      if (taOpener && typeof taOpener.focus === "function") taOpener.focus();
      taOpener = null;
    });
  }

  /* ---------------- 상단 새로고침 ---------------- */
  function wireRefresh() {
    const btn = $("#btn-refresh");
    if (!btn) return;

    /* 캐시 버스터(_v)는 주소창에 남기지 않는다 */
    try {
      const cur = new URL(location.href);
      if (cur.searchParams.has("_v")) {
        cur.searchParams.delete("_v");
        history.replaceState(null, "", cur.toString());
      }
    } catch (e) { /* file:// 등에서는 무시 */ }

    let busy = false;
    btn.addEventListener("click", () => {
      if (busy) return;
      busy = true;
      btn.classList.add("is-spinning");
      btn.setAttribute("aria-busy", "true");
      /* 회전 피드백을 한 박자 보여준 뒤 새로고침 */
      setTimeout(reloadFresh, 240);
      /* 로딩이 막혀도 버튼이 잠긴 채로 남지 않게 */
      setTimeout(() => {
        busy = false;
        btn.classList.remove("is-spinning");
        btn.removeAttribute("aria-busy");
      }, 2600);
    });
  }

  async function reloadFresh() {
    /* file:// · 기타 프로토콜: 일반 새로고침 */
    if (!location.protocol.startsWith("http")) {
      location.reload();
      return;
    }
    try {
      /* 이 페이지를 제어하는 서비스 워커가 있을 때만 그 캐시를 비운다 */
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        if (typeof caches !== "undefined" && caches.keys) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        /* 등록은 유지한 채 업데이트만 요청 (오프라인 사용 보존) */
        if (navigator.serviceWorker.getRegistrations) {
          navigator.serviceWorker.getRegistrations()
            .then((regs) => regs.forEach((r) => (r.update ? r.update().catch(() => {}) : null)))
            .catch(() => {});
        }
      }
    } catch (e) { /* 캐시 정리에 실패해도 아래 캐시 버스터로 최신 문서를 받는다 */ }

    let target = location.href;
    try {
      const u = new URL(location.href);
      u.searchParams.set("_v", String(Date.now()));
      target = u.toString();
    } catch (e) { /* URL 조합 실패 시 원래 주소로 */ }
    location.replace(target);
  }

  /* ---------------- 기사 · 파이프라인 · 푸터 ---------------- */
  function renderArticles(report) {
    const box = $("#articleList");
    box.innerHTML = "";
    (report.articles || []).forEach((a) => {
      const link = el("a", "article");
      link.href = a.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      let host = a.url;
      try { host = new URL(a.url).hostname.replace(/^www\./, ""); } catch (e) { /* keep raw */ }
      link.innerHTML =
        '<span class="article-mark">' + esc(a.mark || a.source) + "</span>" +
        '<span class="article-body">' +
          '<span class="article-src">' + esc(a.source) + "</span>" +
          '<span class="article-title">' + esc(a.title) + "</span>" +
          '<span class="article-url">' + esc(host) + "</span>" +
        "</span>";
      box.appendChild(link);
    });
  }

  function renderPipe(report) {
    const box = $("#pipe");
    box.innerHTML = "";
    (report.stages || []).forEach((s) => {
      const c = el("span", "pchip");
      c.innerHTML = "<b>" + esc(s.time) + "</b> " + esc(s.name) +
        '<span class="st ' + esc(s.status) + '">' + esc(s.statusShort || "") + "</span>";
      c.title = s.statusText || "";
      box.appendChild(c);
    });
  }

  function renderFooter(report) {
    $("#disclaimer").innerHTML = "<b>유의사항</b> · " + esc(report.disclaimer || "");
    const meta = $("#footMeta");
    meta.innerHTML =
      "<span>기준일 · " + esc(report.label) + "</span>" +
      "<span>데이터 · " + esc(report.asOf || "") + "</span>" +
      "<span>성격 · 수급·재료 기반 관찰 정리 (매수·매도 추천 아님)</span>";
  }

  /* ---------------- 전체 ---------------- */
  function render() {
    const report = findReport(activeDate);
    renderChrome(report);
    renderSwitcher(report);
    renderSessionBody(report);
    renderContext(report);
    renderWatchlist(report);
    renderArticles(report);
    renderPipe(report);
    renderFooter(report);
  }

  wireTechnicalDialog();
  wireRefresh();

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", render);
  } else {
    render();
  }
})();
</script>
</body>
